services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      BURGER_DB: ${BURGER_DB:-/app/data/burger.db}
      BURGER_SEED_FIXTURES: ${BURGER_SEED_FIXTURES:-0}
      BURGER_LIVE_TUTU: ${BURGER_LIVE_TUTU:-0}
      BURGER_SC_PRICE_ACCEPTED: ${BURGER_SC_PRICE_ACCEPTED:-0}
      BURGER_COVERAGE: ${BURGER_COVERAGE:-/app/data/coverage.json}
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
