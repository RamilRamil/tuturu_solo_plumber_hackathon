services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BURGER_DB: /app/data/burger.g10.db
      BURGER_SEED_FIXTURES: "1"
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
